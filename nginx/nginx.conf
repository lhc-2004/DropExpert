worker_processes auto;

events {
    worker_connections 4096;
}

http {
    upstream backend {
        zone backend 64k;
        server api:8080;
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            add_header X-Upstream $upstream_addr always;
        }
    }
}
