worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # One line per request: time | status | seconds taken | which API(s) | their status(es)
    log_format timing '$msec|$status|$request_time|$upstream_addr|$upstream_status';
    access_log /var/log/nginx/requests.log timing;

    upstream backend {
        zone backend 64k;
        # After 1 failure, skip this server for 10 seconds, then try it again
        server api:8080 max_fails=1 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            # Give up on a server that doesn't accept a connection within 1 second...
            proxy_connect_timeout 1s;
            # ...and try the request once more on a different server
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;

            add_header X-Upstream $upstream_addr always;
        }
    }
}
